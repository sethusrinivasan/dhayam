name: Production Liveness & E2E Validation

on:
  schedule:
    # Every 6 hours: verify both staging and production remain healthy.
    # Not triggered on push/pull_request — the deploy pipeline (cloudflare.yml)
    # runs its own E2E gate against staging before any code reaches production,
    # so firing the liveness check on push would race against an in-progress
    # deploy and produce false failures against the old production build.
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-production:
    name: Validate Live URLs & Cloudflare E2E
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Verify JavaScript syntax & browser integrity
        run: npm test

      - name: 🧪 Staging health check
        run: node scripts/e2e-live-check.js
        env:
          CLOUDFLARE_URL: "https://dhayam-staging.cancun.workers.dev"
          GITHUB_PAGES_URL: "https://sethusrinivasan.github.io/dhayam/"
          E2E_SKIP_GITHUB_PAGES: "true"

      - name: 💨 Production health check
        run: node scripts/e2e-live-check.js
        env:
          CLOUDFLARE_URL: "https://dhayam.cancun.workers.dev"
          GITHUB_PAGES_URL: "https://sethusrinivasan.github.io/dhayam/"
