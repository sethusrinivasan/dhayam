name: Deploy to Cloudflare (Staging → Manual Approval → Production)

# ─── Deployment Strategy ──────────────────────────────────────────────────
#
#  Every push to `main`:
#
#    ┌── Job 1: deploy-staging ────────────────────────────────────────────┐
#    │  Deploy code to dhayam-staging.cancun.workers.dev                  │
#    └────────────────────────────────────────────────────────────────────┘
#                              │
#    ┌── Job 2: validate-staging ──────────────────────────────────────────┐
#    │  npm test (unit + syntax + headless Chrome integrity)               │
#    │  E2E liveness against staging: HTTP /health /mcp + roll dice        │
#    │  Posts staging URL and E2E report as a GitHub summary               │
#    └────────────────────────────────────────────────────────────────────┘
#                              │ PASSES
#    ┌── Job 3: await-approval ─────────────────────────────────────────────┐
#    │  ⏸  PAUSES here — requires manual review in GitHub UI               │
#    │  Reviewer sees: staging URL, E2E pass, commit SHA, and diff link     │
#    │  Reviewer manually tests https://dhayam-staging.cancun.workers.dev   │
#    │  Then clicks ✅ "Approve and deploy" (or ❌ "Reject")               │
#    └────────────────────────────────────────────────────────────────────┘
#                              │ APPROVED
#    ┌── Job 4: deploy-production ─────────────────────────────────────────┐
#    │  Deploy to dhayam.cancun.workers.dev (production)                  │
#    └────────────────────────────────────────────────────────────────────┘
#                              │
#    ┌── Job 5: smoke-production ──────────────────────────────────────────┐
#    │  Final E2E smoke check on production                               │
#    └────────────────────────────────────────────────────────────────────┘
#
# ─────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_approval:
        description: "Emergency bypass: skip manual approval gate (use only if staging is down)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true    # cancel superseded runs so fresh commits roll into staging immediately

jobs:
  # ─── Job 1: Deploy to Staging ──────────────────────────────────────────
  deploy-staging:
    name: "🚧 [1/5] Deploy to Staging"
    runs-on: ubuntu-latest
    outputs:
      has_token: ${{ steps.check_secrets.outputs.has_token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Cloudflare secrets
        id: check_secrets
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "has_token=true" >> $GITHUB_OUTPUT
          else
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::error::CLOUDFLARE_API_TOKEN is not configured in GitHub Secrets! Automated Cloudflare staging deploy cannot proceed without credentials. Please configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository secrets."
            exit 1
          fi

      - name: "🚧 Deploy → dhayam-staging.cancun.workers.dev"
        if: steps.check_secrets.outputs.has_token == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env staging

  # ─── Job 2: Validate Staging (automated E2E) ───────────────────────────
  validate-staging:
    name: "🧪 [2/5] Automated E2E Gate (Staging)"
    needs: deploy-staging
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Run unit + integrity tests (JS syntax, headless Chrome, rules engine)
        run: npm test

      - name: "🧪 E2E liveness + game interaction against STAGING"
        id: e2e
        run: node scripts/e2e-live-check.js
        env:
          CLOUDFLARE_URL: "https://dhayam-staging.cancun.workers.dev"
          GITHUB_PAGES_URL: "https://sethusrinivasan.github.io/dhayam/"
          E2E_SKIP_GITHUB_PAGES: "true"

      - name: "📋 Post staging verification summary"
        if: always()
        run: |
          STATUS="${{ steps.e2e.outcome }}"
          ICON="✅"
          if [ "$STATUS" != "success" ]; then ICON="❌"; fi
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## $ICON Staging Automated E2E Report

          | Item | Value |
          |------|-------|
          | **Staging URL** | [dhayam-staging.cancun.workers.dev](https://dhayam-staging.cancun.workers.dev) |
          | **Commit** | \`${{ github.sha }}\` |
          | **Branch** | \`${{ github.ref_name }}\` |
          | **E2E Result** | $ICON \`$STATUS\` |
          | **Tests** | JS syntax ✓, rules engine ✓, headless Chrome ✓ |

          ### 👤 Next step — Manual QA
          Open **[staging](https://dhayam-staging.cancun.workers.dev)**, play a full turn, and
          verify the game is interactive before approving production promotion.

          > Approval request will appear in the **[Environments tab](https://github.com/sethusrinivasan/dhayam/deployments)** after this job finishes.
          EOF

  # ─── Job 3: Manual Approval Gate ───────────────────────────────────────
  await-approval:
    name: "⏸ [3/5] Manual Approval — Test Staging Before Promoting"
    needs: validate-staging
    runs-on: ubuntu-latest
    # No environment here — staging is already live and accessible without any gate.
    # The production environment gate is applied in Job 4 (deploy-production) only.

    steps:
      - name: "🧑‍💻 Await manual approval before production"
        run: |
          echo "✅ Staging verified. Awaiting manual approval for production promotion."
          echo "Staging: https://dhayam-staging.cancun.workers.dev"

      - name: "📋 Record approval gate in job summary"
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## ⏸ Awaiting Manual Approval for Production

          | Item | Value |
          |------|-------|
          | **Staging URL** | [dhayam-staging.cancun.workers.dev](https://dhayam-staging.cancun.workers.dev) |
          | **Commit** | \`${{ github.sha }}\` |
          | **Next step** | Approve in the Environments tab to promote to production |
          EOF

  # ─── Job 4: Deploy to Production ───────────────────────────────────────
  deploy-production:
    name: "🚀 [4/5] Deploy to Production"
    needs: [deploy-staging, await-approval]
    runs-on: ubuntu-latest
    # The production environment gate (required reviewers) lives here — only production is gated.
    environment:
      name: production
      url: https://dhayam.cancun.workers.dev
    if: |
      always() && (
        needs.await-approval.result == 'success' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_approval == 'true')
      )

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Cloudflare secrets
        id: check_secrets
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "has_token=true" >> $GITHUB_OUTPUT
          else
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::error::CLOUDFLARE_API_TOKEN is not configured in GitHub Secrets! Production deploy cannot proceed without credentials."
            exit 1
          fi

      - name: "🚀 Deploy → dhayam.cancun.workers.dev (production)"
        if: steps.check_secrets.outputs.has_token == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

  # ─── Job 5: Production Smoke Check ─────────────────────────────────────
  smoke-production:
    name: "💨 [5/5] Production Smoke Check"
    needs: deploy-production
    runs-on: ubuntu-latest
    if: needs.deploy-production.result == 'success'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: "💨 Production E2E smoke check"
        id: smoke
        run: node scripts/e2e-live-check.js
        env:
          CLOUDFLARE_URL: "https://dhayam.cancun.workers.dev"
          GITHUB_PAGES_URL: "https://sethusrinivasan.github.io/dhayam/"

      - name: "📋 Final deployment summary"
        if: always()
        run: |
          STATUS="${{ steps.smoke.outcome }}"
          ICON="✅"
          if [ "$STATUS" != "success" ]; then ICON="❌"; fi
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## $ICON Production Deployment Complete

          | Item | Value |
          |------|-------|
          | **Production URL** | [dhayam.cancun.workers.dev](https://dhayam.cancun.workers.dev) |
          | **Commit** | \`${{ github.sha }}\` |
          | **Smoke Check** | $ICON \`$STATUS\` |
          | **Deployed at** | $(date -u '+%Y-%m-%d %H:%M UTC') |
          EOF
