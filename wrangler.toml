name = "dhayam"
main = "cloudflare/worker.js"
compatibility_date = "2024-09-23"

# Frugal static asset hosting: serves site/ directly on Cloudflare Edge CDN
[assets]
directory = "./site"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"

[durable_objects]
bindings = [
  { name = "DHAYAM_ROOM", class_name = "DhayamRoom" }
]

# Cloudflare D1 Serverless Database Binding (Optional)
# To bind remote D1, run: npx wrangler d1 create dhayam-db and paste the database_id below.
# When omitted, the worker uses its tested in-memory datastore fallback automatically.
# [[d1_databases]]
# binding = "DB"
# database_name = "dhayam-db"
# database_id = "<your-d1-uuid>"

[vars]
GOOGLE_CLIENT_ID = "764310467229-rkh1lrv0tclv07d8q10dj426didl1u8f.apps.googleusercontent.com"
GITHUB_CLIENT_ID = "Ov23liHwuHgasom2EnpI"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DhayamRoom"]

# ─── Staging environment ────────────────────────────────────────────────────
# Deployed as a separate Cloudflare Worker: dhayam-staging.cancun.workers.dev
# Changes land here first, pass E2E validation, then get promoted to production.
[env.staging]
name = "dhayam-staging"

[env.staging.assets]
directory = "./site"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"

[env.staging.durable_objects]
bindings = [
  { name = "DHAYAM_ROOM", class_name = "DhayamRoom" }
]

# [[env.staging.d1_databases]]
# binding = "DB"
# database_name = "dhayam-staging-db"
# database_id = "<your-staging-d1-uuid>"

[env.staging.vars]
GOOGLE_CLIENT_ID = "764310467229-rkh1lrv0tclv07d8q10dj426didl1u8f.apps.googleusercontent.com"
GITHUB_CLIENT_ID = "Ov23liHwuHgasom2EnpI"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["DhayamRoom"]
